<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      animation: fadeInDown 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    h1 span {
      background: linear-gradient(90deg, #6c63ff 0%, #a78bfa 50%, #6c63ff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      background: #fff;
      transition: border-color 0.2s;
    }

    .input-row input.shake {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      18%       { transform: translateX(-7px); }
      36%       { transform: translateX(7px); }
      54%       { transform: translateX(-4px); }
      72%       { transform: translateX(4px); }
    }

    .input-row input:focus {
      border-color: #6c63ff;
    }

    .input-row button {
      padding: 12px 20px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.4rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .input-row button:hover { background: #5a52d5; }
    .input-row button:active { transform: scale(0.95); }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filters button {
      flex: 1;
      padding: 8px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
      color: #555;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filters button.active {
      background: #6c63ff;
      border-color: #6c63ff;
      color: #fff;
    }

    .filters button:hover:not(.active) {
      border-color: #6c63ff;
      color: #6c63ff;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      animation: slideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .todo-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 16px rgba(108,99,255,0.13);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-24px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .todo-item.removing {
      animation: slideOut 0.3s ease forwards;
      pointer-events: none;
      overflow: hidden;
    }

    @keyframes slideOut {
      0%   { opacity: 1; transform: translateX(0);    max-height: 80px; padding-top: 14px; padding-bottom: 14px; margin: 0; }
      55%  { opacity: 0; transform: translateX(60px); max-height: 80px; padding-top: 14px; padding-bottom: 14px; margin: 0; }
      100% { opacity: 0; transform: translateX(60px); max-height: 0;    padding-top: 0;    padding-bottom: 0;    margin: 0; }
    }

    .todo-item.just-completed {
      animation: completePulse 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes completePulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.04); background: #f0eeff; }
      100% { transform: scale(1); }
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      accent-color: #6c63ff;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 0.97rem;
      color: #333;
      word-break: break-word;
    }

    .todo-text[contenteditable="true"] {
      outline: none;
      border-bottom: 2px solid #6c63ff;
      padding-bottom: 2px;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-edit  { color: #6c63ff; }
    .btn-edit:hover  { background: #ede9ff; }
    .btn-delete { color: #e74c3c; }
    .btn-delete:hover { background: #fdecea; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      font-size: 0.85rem;
      color: #888;
    }

    .footer button {
      background: none;
      border: none;
      color: #e74c3c;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .footer button:hover { text-decoration: underline; }

    .empty {
      text-align: center;
      color: #bbb;
      padding: 40px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>My <span>Todos</span></h1>

    <div class="input-row">
      <input id="todoInput" type="text" placeholder="Add a new task..." />
      <button id="addBtn" title="Add task">+</button>
    </div>

    <div class="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>

    <div class="footer">
      <span id="itemsLeft"></span>
      <button id="clearBtn">Clear completed</button>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let filter = 'all';

    const input    = document.getElementById('todoInput');
    const addBtn   = document.getElementById('addBtn');
    const list     = document.getElementById('todoList');
    const itemsLeft = document.getElementById('itemsLeft');
    const clearBtn = document.getElementById('clearBtn');
    const filterBtns = document.querySelectorAll('.filters button');

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function render() {
      const visible = todos.filter(t =>
        filter === 'all' ? true :
        filter === 'active' ? !t.done :
        t.done
      );

      list.innerHTML = '';

      if (visible.length === 0) {
        list.innerHTML = '<li class="empty">No tasks here!</li>';
      } else {
        visible.forEach(todo => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (todo.done ? ' completed' : '');
          li.dataset.id = todo.id;

          li.innerHTML = `
            <input class="todo-checkbox" type="checkbox" ${todo.done ? 'checked' : ''} />
            <span class="todo-text">${escHtml(todo.text)}</span>
            <button class="btn-icon btn-edit" title="Edit">&#9998;</button>
            <button class="btn-icon btn-delete" title="Delete">&#128465;</button>
          `;
          list.appendChild(li);
        });
      }

      const remaining = todos.filter(t => !t.done).length;
      itemsLeft.textContent = `${remaining} item${remaining !== 1 ? 's' : ''} left`;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) {
        input.classList.remove('shake');
        void input.offsetWidth; // reflow to restart animation
        input.classList.add('shake');
        input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
        return;
      }
      todos.unshift({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

    list.addEventListener('change', e => {
      if (!e.target.matches('.todo-checkbox')) return;
      const id = +e.target.closest('.todo-item').dataset.id;
      const todo = todos.find(t => t.id === id);
      if (!todo) return;
      todo.done = e.target.checked;
      save();
      if (todo.done) {
        const itemEl = e.target.closest('.todo-item');
        itemEl.classList.add('completed', 'just-completed');
        itemEl.addEventListener('animationend', () => render(), { once: true });
      } else {
        render();
      }
    });

    list.addEventListener('click', e => {
      const item = e.target.closest('.todo-item');
      if (!item) return;
      const id = +item.dataset.id;

      if (e.target.matches('.btn-delete')) {
        item.classList.add('removing');
        item.addEventListener('animationend', () => {
          todos = todos.filter(t => t.id !== id);
          save(); render();
        }, { once: true });
        return;
      }

      if (e.target.matches('.btn-edit')) {
        const span = item.querySelector('.todo-text');
        span.contentEditable = 'true';
        span.focus();

        const range = document.createRange();
        range.selectNodeContents(span);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);

        function commitEdit() {
          span.contentEditable = 'false';
          const newText = span.textContent.trim();
          if (newText) {
            const todo = todos.find(t => t.id === id);
            if (todo) { todo.text = newText; save(); render(); }
          } else {
            render();
          }
        }

        span.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); commitEdit(); }
          if (e.key === 'Escape') render();
        }, { once: true });

        span.addEventListener('blur', commitEdit, { once: true });
      }
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        filterBtns.forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    clearBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      save(); render();
    });

    render();
  </script>
</body>
</html>
